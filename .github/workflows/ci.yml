name: CI

on: 
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Install deps
              run: |
                sudo apt-get update
                sudo apt-get install -y ninja-build zlib1g-dev libssl-dev
            - name: Configure
              run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
            - name: Build
              run: cmake --build build
            - name: Test
              run: ctest --test-dir build --output-on-failure --no-tests=error
